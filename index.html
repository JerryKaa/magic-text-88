<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>✨ Magic Text 88 💅</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fbc2eb">
  <link rel="apple-touch-icon" href="icon-512.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { overscroll-behavior-y: none; overscroll-behavior-x: none; }
    * { -webkit-tap-highlight-color: transparent; outline: none; }
    body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); min-height: 100vh; touch-action: manipulation; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 35px rgba(236, 72, 153, 0.15); }
    .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="p-4 md:p-8 text-gray-800 flex flex-col items-center justify-center relative min-h-screen">

  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none z-[200] transition-opacity duration-300 font-bold whitespace-nowrap">
    แจ้งเตือน
  </div>

  <div id="loginScreen" class="fixed inset-0 modal-overlay z-[100] flex flex-col items-center justify-center p-4">
    <div class="glass w-full max-w-sm p-8 flex flex-col items-center shadow-2xl">
      <h1 class="text-3xl font-bold text-center text-purple-600 mb-2">💖 Magic Text 88</h1>
      <p class="text-center text-sm text-pink-500 mb-6 font-semibold">เฉพาะลูกทีม VIP เท่านั้น 💅</p>
      
      <input type="text" id="loginUser" class="w-full p-3 mb-4 rounded-xl border-2 border-purple-200 focus:border-purple-500 text-center font-bold" placeholder="ชื่อผู้ใช้ (Username)" autocomplete="off">
      <input type="password" id="loginPass" class="w-full p-3 mb-6 rounded-xl border-2 border-purple-200 focus:border-purple-500 text-center font-bold" placeholder="รหัสผ่าน (Password)">
      
      <button id="loginBtn" onclick="doLogin()" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xl py-3 rounded-xl shadow-lg hover:scale-105 transition-transform">
        🔓 เข้าสู่ระบบ
      </button>
    </div>
  </div>

  <div id="appContent" class="max-w-lg w-full glass p-6 md:p-8 relative z-10 hidden">
    <div class="absolute top-4 right-4 flex gap-2">
      <button onclick="openSettings()" class="text-2xl bg-white/50 hover:bg-white/80 p-2 rounded-full shadow-sm" title="ตั้งค่าข้อความ">⚙️</button>
      <button onclick="doLogout()" class="text-lg bg-red-100 text-red-500 hover:bg-red-200 p-2 px-3 rounded-full shadow-sm font-bold" title="ออกจากระบบ">ออก</button>
    </div>

    <h1 class="text-3xl font-bold text-center text-purple-600 mb-2 mt-4">
      💖 Magic Text 88 <br>
      <span class="text-xl text-pink-500">by Jerry.Shop88</span> 💅
    </h1>
    <p class="text-center text-sm text-pink-500 mb-6 font-semibold">ยินดีต้อนรับคุณ: <span id="displayUsername" class="text-purple-700"></span></p>
    
    <div id="resultBox" class="hidden mb-8 bg-gradient-to-br from-pink-50 to-purple-50 p-5 rounded-xl border-2 border-pink-300 shadow-inner">
      <label class="block text-center font-bold text-pink-700 text-lg mb-2">✨ ข้อความพร้อมส่งลูกค้า ✨</label>
      <textarea id="finalText" rows="20" class="w-full p-3 rounded-lg border border-pink-200 text-gray-700 font-medium text-sm md:text-base resize-y focus:outline-none bg-white/80 leading-relaxed break-all" spellcheck="false" readonly></textarea>
      <button onclick="copyFinalText()" class="w-full mt-3 bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 text-white font-bold text-xl py-3 rounded-xl shadow-lg">
        📋 ก๊อปปี้ส่งลูกค้าเลยแม่!
      </button>
    </div>

    <label class="block text-sm font-semibold mb-2 text-gray-700">1. เลือกแอปที่ลูกค้าซื้อ 🛍️</label>
    <div class="flex flex-col gap-2 mb-6">
      <select id="appSelect" onchange="checkAppType()" class="w-full p-3 border-2 border-purple-200 rounded-xl font-bold text-purple-700 bg-white shadow-sm">
        <option value="Meitu">🌸 Meitu</option>
        <option value="Wink">😉 Wink</option>
        <option value="Beautycam">📸 Beautycam</option>
        <option value="Capcut">✂️ Capcut</option>
        <option value="other">✍️ อื่นๆ (พิมพ์ชื่อแอปเอง...)</option>
      </select>
      <input type="text" id="customApp" class="hidden w-full p-3 border-2 border-pink-300 rounded-xl font-bold text-pink-700 shadow-sm" placeholder="พิมพ์ชื่อแอปตรงนี้เลยแม่..." spellcheck="false">
    </div>

    <div class="flex justify-between items-end mb-2">
      <label class="block text-sm font-semibold text-gray-700">2. วางข้อมูลตรงนี้ 👇</label>
      <button type="button" onclick="resetAll()" class="bg-red-50 text-red-500 border border-red-200 px-3 py-1 rounded-full text-xs font-bold shadow-sm">🔄 ล้างข้อมูลใหม่</button>
    </div>
    <textarea id="rawData" rows="4" class="w-full p-3 border-2 border-purple-200 rounded-xl mb-6 break-all shadow-sm" placeholder="วางข้อมูลบัญชีหรือรหัสผ่านลงตรงนี้ได้เลย..." spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
    
    <label class="block text-sm font-semibold mb-2 text-gray-700">3. เลือกระยะเวลา (กดปุ๊บคำนวณปั๊บ)</label>
    <div class="grid grid-cols-3 gap-3 mb-4">
      <button type="button" onclick="generateText(1)" class="bg-purple-50 active:bg-purple-200 border border-purple-200 text-purple-700 font-bold py-3 rounded-xl shadow-sm text-lg">1 วัน</button>
      <button type="button" onclick="generateText(3)" class="bg-purple-50 active:bg-purple-200 border border-purple-200 text-purple-700 font-bold py-3 rounded-xl shadow-sm text-lg">3 วัน</button>
      <button type="button" onclick="generateText(5)" class="bg-purple-50 active:bg-purple-200 border border-purple-200 text-purple-700 font-bold py-3 rounded-xl shadow-sm text-lg">5 วัน</button>
      <button type="button" onclick="generateText(7)" class="bg-purple-50 active:bg-purple-200 border border-purple-200 text-purple-700 font-bold py-3 rounded-xl shadow-sm text-lg">7 วัน</button>
      <button type="button" onclick="generateText(14)" class="bg-purple-50 active:bg-purple-200 border border-purple-200 text-purple-700 font-bold py-3 rounded-xl shadow-sm text-lg">14 วัน</button>
      <button type="button" onclick="generateText(28)" class="bg-purple-50 active:bg-purple-200 border border-purple-200 text-purple-700 font-bold py-3 rounded-xl shadow-sm text-lg">28 วัน</button>
    </div>
    
    <div class="flex items-center gap-3">
      <span class="text-sm font-semibold text-gray-700">หรือพิมพ์วันเอง:</span>
      <input type="tel" id="customDays" onkeypress="handleEnter(event)" class="w-24 p-2 border-2 border-purple-200 rounded-xl text-center font-bold shadow-sm" placeholder="ระบุวัน" spellcheck="false">
      <button type="button" onclick="generateCustomText()" class="flex-1 bg-purple-500 text-white font-bold py-2 rounded-xl shadow-sm">ตกลง</button>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 modal-overlay z-50 hidden flex-col items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h2 class="text-2xl font-bold text-purple-700 mb-4 text-center">☁️ ตั้งค่าข้อความบน Cloud</h2>
      
      <label class="block text-sm font-bold text-gray-700 mb-1 mt-4">💬 เงื่อนไขการใช้งาน (บนสุด)</label>
      <textarea id="tplCondition" rows="4" class="w-full p-2 border border-purple-200 rounded-lg text-sm bg-gray-50 focus:bg-white" spellcheck="false"></textarea>

      <label class="block text-sm font-bold text-gray-700 mb-1 mt-4">📧 วิธีเข้าสู่ระบบ (กรณีอีเมล)</label>
      <textarea id="tplHowToEmail" rows="5" class="w-full p-2 border border-purple-200 rounded-lg text-sm bg-gray-50 focus:bg-white" spellcheck="false"></textarea>

      <label class="block text-sm font-bold text-gray-700 mb-1 mt-4">📱 วิธีเข้าสู่ระบบ (กรณีเบอร์โทร)</label>
      <p class="text-xs text-pink-500 mb-1">💡 ใส่คำว่า <span class="font-bold bg-pink-100 px-1 rounded">{PHONE_PREFIX}</span> เพื่อให้ระบบเติม +852 หรือ +86 อัตโนมัติ</p>
      <textarea id="tplHowToPhone" rows="5" class="w-full p-2 border border-purple-200 rounded-lg text-sm bg-gray-50 focus:bg-white" spellcheck="false"></textarea>

      <label class="block text-sm font-bold text-gray-700 mb-1 mt-4">🚨 คำเตือนออกจากระบบ (ล่างสุด)</label>
      <textarea id="tplWarning" rows="3" class="w-full p-2 border border-purple-200 rounded-lg text-sm bg-gray-50 focus:bg-white" spellcheck="false"></textarea>
      
      <label class="block text-sm font-bold text-gray-700 mb-1 mt-4">🙏 คำขอบคุณท้ายข้อความ</label>
      <textarea id="tplThankYou" rows="2" class="w-full p-2 border border-purple-200 rounded-lg text-sm bg-gray-50 focus:bg-white" spellcheck="false"></textarea>

      <div class="flex gap-3 mt-6">
        <button onclick="closeSettings()" class="w-1/3 bg-gray-200 text-gray-700 font-bold py-2 rounded-xl">ยกเลิก</button>
        <button id="saveBtn" onclick="saveSettingsOnCloud()" class="w-2/3 bg-purple-600 text-white font-bold py-2 rounded-xl shadow-md">☁️ เซฟขึ้น Cloud</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlXdq92GRh2FQr5IOOmX5AotKTK-on_NRzYu97ieq7cxlL95H24Q91f7sjKg3vVIMRkA/exec"; 

    const defaultTemplates = {
      condition: `🚨‼️ รบกวนอ่านให้ครบทุกบรรทัด และดูรูปวิธีเข้าใช้งานอย่างละเอียดด้วยนะคะ ‼️🚨\n\n♡ เงื่อนไขการใช้งานค่าา ♡\n⛔️ ล็อกอินได้เพียง 1 อุปกรณ์เท่านั้น ห้ามเปลี่ยนอุปกรณ์ ⛔️\n⛔️ ล็อกอินภายใน 10 นาทีเท่านั้น ⛔️\n❇️ กรณีทำตามแล้วมีปัญหา เค้ายินดีเคลมให้ค่า ❇️\n\n☆ วิธีการเข้าใช้งาน ☆`,
      howToEmail: `1. เปิดเมนูเข้าสู่ระบบ เลือก "เข้าด้วยเมล" \n   (บางคนไม่มีให้กดเข้าด้วยเมล ล็อกอินด้วยเบอร์ กดล็อกอินด้วยรหัส แล้วจะมีไอคอนสีเหลืองขึ้นมา)\n2. กรอกเมลและรหัสที่ทางร้านให้ไป เรียบร้อยพร้อมสวยค่าา ✨\n\n⚠️ เมลไม่ใช่ google น้า\n⭕️ กรณีติดยืนยัน: กดครั้งเดียวพอ รหัสอยู่ได้ 10 นาที ค้างหน้าจอไว้ก่อน แล้วขอรหัสกับทางร้านได้เลยค่า ⭕️`,
      howToPhone: `1. เปิดเมนูเข้าสู่ระบบ เลือกล็อกอินผ่านหมายเลขโทรศัพท์ (ไอคอนสีชมพู)\n*** 2. ปรับหน้าเบอร์เป็น {PHONE_PREFIX} (ตรงหน้าเบอร์โทรศัพท์) ***\n3. 🚨 ❗️ เน้นย้ำ!! ต้องกด "ล็อกอินด้วยรหัสผ่าน" เท่านั้นนะคะ ❗️ 🚨\n4. กรอกรหัสที่ทางร้านให้ไป เรียบร้อยพร้อมสวยค่าา ✨`,
      warning: `🚨 💡 วิธีกดออกจากระบบบัญชีเดิม 💡 🚨\n👉 ให้ "เข้า" ไปกดออกตรง "บัญชีและความปลอดภัย" นะคะ ❗️`,
      thankYou: `♡ ขอบคุณที่ใช้บริการนะคะ ♡\n𓂂 ˳ׄ 𓂂 สงสัยตรงไหนถามเค้าได้เลยน้าา 𓂂 ˳ׄ 𓂂`
    };

    let currentUser = localStorage.getItem('magicTextUser') || null;
    let userTemplates = JSON.parse(localStorage.getItem('magicTextTemplates')) || defaultTemplates;

    window.onload = function() {
      if(currentUser) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').classList.remove('hidden');
        document.getElementById('displayUsername').innerText = currentUser;
      }
    }

    async function doLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if(!user || !pass) return showToast("⚠️ กรอกชื่อกับรหัสก่อนสิคะแม่!", false);

      const btn = document.getElementById('loginBtn');
      btn.innerText = "⏳ กำลังตรวจสอบ...";
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ action: 'login', user: user, pass: pass })
        });
        const result = await response.json();
        
        if(result.success) {
          currentUser = user;
          localStorage.setItem('magicTextUser', user);
          
          if(result.templates) {
            userTemplates = result.templates;
            localStorage.setItem('magicTextTemplates', JSON.stringify(userTemplates));
          } else {
            userTemplates = defaultTemplates; 
          }

          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('appContent').classList.remove('hidden');
          document.getElementById('displayUsername').innerText = user;
          showToast("🎉 เข้าสู่ระบบสำเร็จ!", true);
        } else {
          showToast(result.message, false);
        }
      } catch (err) {
        showToast("❌ ระบบเครือข่ายมีปัญหา ลองใหม่นะคะ", false);
      }
      btn.innerText = "🔓 เข้าสู่ระบบ";
      btn.disabled = false;
    }

    function doLogout() {
      currentUser = null;
      localStorage.removeItem('magicTextUser');
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appContent').classList.add('hidden');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }

    function openSettings() {
      document.getElementById('tplCondition').value = userTemplates.condition;
      document.getElementById('tplHowToEmail').value = userTemplates.howToEmail;
      document.getElementById('tplHowToPhone').value = userTemplates.howToPhone;
      document.getElementById('tplWarning').value = userTemplates.warning;
      document.getElementById('tplThankYou').value = userTemplates.thankYou;
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('settingsModal').classList.add('flex');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
    }

    async function saveSettingsOnCloud() {
      const btn = document.getElementById('saveBtn');
      btn.innerText = "⏳ กำลังเซฟ...";
      btn.disabled = true;

      const newTpls = {
        condition: document.getElementById('tplCondition').value,
        howToEmail: document.getElementById('tplHowToEmail').value,
        howToPhone: document.getElementById('tplHowToPhone').value,
        warning: document.getElementById('tplWarning').value,
        thankYou: document.getElementById('tplThankYou').value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ 
            action: 'save', 
            user: currentUser, 
            data: JSON.stringify(newTpls) 
          })
        });
        const result = await response.json();
        
        if(result.success) {
          userTemplates = newTpls;
          localStorage.setItem('magicTextTemplates', JSON.stringify(userTemplates));
          closeSettings();
          showToast("☁️ บันทึกขึ้น Cloud เรียบร้อย!", true);
        } else {
          showToast("❌ เซฟไม่ผ่าน! ลองใหม่นะแม่", false);
        }
      } catch (err) {
        showToast("❌ ระบบเครือข่ายมีปัญหา", false);
      }
      btn.innerText = "☁️ เซฟขึ้น Cloud";
      btn.disabled = false;
    }

    let toastTimeout;
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.className = isSuccess 
        ? 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl z-[200] transition-opacity duration-300 opacity-100 font-bold whitespace-nowrap'
        : 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-pink-600 text-white px-6 py-3 rounded-full shadow-2xl z-[200] transition-opacity duration-300 opacity-100 font-bold whitespace-nowrap';
      if (navigator.vibrate) navigator.vibrate(50);
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.classList.replace('opacity-100', 'opacity-0'); }, 2000);
    }

    function checkAppType() {
      const select = document.getElementById('appSelect');
      const customInput = document.getElementById('customApp');
      if (select.value === 'other') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
      }
    }

    function hideKeyboard() {
      document.getElementById('rawData').blur();
      document.getElementById('customDays').blur();
      document.getElementById('customApp').blur();
    }

    function resetAll() {
      document.getElementById('rawData').value = '';
      document.getElementById('customDays').value = '';
      document.getElementById('finalText').value = '';
      document.getElementById('appSelect').selectedIndex = 0;
      document.getElementById('customApp').value = '';
      document.getElementById('customApp').classList.add('hidden');
      document.getElementById('resultBox').style.display = 'none';
      hideKeyboard();
    }

    function handleEnter(event) {
      if (event.key === 'Enter') { event.preventDefault(); generateCustomText(); }
    }

    function generateText(days) {
      hideKeyboard(); 
      const rawText = document.getElementById('rawData').value.trim();
      if (!rawText) return showToast("⚠️ ว้ายยย ลืมวางข้อมูลค่ะซิส!", false);

      let appName = document.getElementById('appSelect').value;
      if (appName === 'other') appName = document.getElementById('customApp').value.trim() || "ไม่ระบุแอป";

      const appLogos = { "Meitu": "🌸", "Wink": "😉", "Beautycam": "📸", "Capcut": "✂️" };
      const appIcon = appLogos[appName] || "🛍️";

      let id = "", password = "";
      const cleanLines = rawText.split('\n').map(line => line.trim()).filter(line => line !== "");
      
      if (rawText.match(/(?:อี)?เมล\s*:/) || rawText.match(/รหัส(?:ผ่าน)?\s*:/) || rawText.match(/เบอร์(?:โทร)?\s*:/)) {
        const mailMatch = rawText.match(/(?:อี)?เมล\s*:\s*([^\s]+)/);
        const phoneMatch = rawText.match(/เบอร์(?:โทร)?\s*:\s*([^\s]+)/);
        const passMatch = rawText.match(/รหัส(?:ผ่าน)?\s*:\s*([^\s]+)/);
        if (mailMatch) id = mailMatch[1];
        else if (phoneMatch) id = phoneMatch[1];
        if (passMatch) password = passMatch[1];
      } else if (rawText.includes("密码")) {
        try {
          id = rawText.split("密码")[0].trim();
          let rest = rawText.split("密码")[1];
          password = rest.includes("链接") ? rest.split("链接")[0].trim() : rest.trim();
        } catch (e) { id = rawText; }
      } else if (cleanLines.length >= 2) {
        id = cleanLines[0]; password = cleanLines[1];   
      } else { id = rawText.trim(); }

      const isEmail = /@[^\s@]+\.[^\s@]+/.test(id) || id.includes('@') || rawText.match(/(?:อี)?เมล\s*:/);
      let idLabel = "", phoneHowToText = "";

      if (isEmail) {
        idLabel = `📧 𝐄𝐦𝐚𝐢𝐥 : ${id}`;
      } else {
        const digitOnly = id.replace(/\D/g, ''); 
        let prefixLabel = "+852 (HongKong)"; 
        if (digitOnly.length === 11) prefixLabel = "+86 (China)";
        else if (digitOnly.length === 8) prefixLabel = "+852 (HongKong)";
        
        idLabel = `📱 𝐏𝐡𝐨𝐧𝐞 (${prefixLabel}) : ${id}`;
        phoneHowToText = userTemplates.howToPhone.replace(/{PHONE_PREFIX}/g, prefixLabel);
      }

      const d = new Date(); d.setDate(d.getDate() + parseFloat(days));
      const dateStr = d.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

      const appHeader = `${appIcon} แอป : ${appName} (${days} วัน)\n`;
      let instructionBody = isEmail ? userTemplates.howToEmail : phoneHowToText;
      const accountInfo = `⋆ ˚｡⋆୨୧ 𝐀𝐜𝐜𝐨𝐮𝐧𝐭 𝐈𝐧𝐟𝐨 ୨୧⋆ ˚｡⋆\n⏳ 𝐄𝐱𝐩𝐢𝐫𝐞 : ${dateStr} เวลา ${timeStr} น.\n${idLabel}\n🔑 𝐏𝐚𝐬𝐬𝐰𝐨𝐫𝐝 : ${password || '-'}\n⛔️ รบกวนพิมพ์เอา ไม่ก๊อปนะคะ ⛔️`;
      const finalText = `${appHeader}\n${userTemplates.condition}\n${instructionBody}\n\n${accountInfo}\n\n${userTemplates.warning}\n\n${userTemplates.thankYou}`;

      document.getElementById('finalText').value = finalText;
      const resultBox = document.getElementById('resultBox');
      if(resultBox.style.display !== 'block') {
        resultBox.style.display = 'block';
        resultBox.classList.remove('fade-in-up');
        void resultBox.offsetWidth; 
        resultBox.classList.add('fade-in-up');
      }
      setTimeout(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, 100);
      if (navigator.vibrate) navigator.vibrate(50);
    }

    function generateCustomText() {
      const days = document.getElementById('customDays').value;
      if (!days || isNaN(days) || parseFloat(days) <= 0) return showToast("⚠️ ระบุจำนวนวันให้ถูกต้องก่อนนะคะแม่!", false);
      generateText(days);
    }

    function copyFinalText() {
      const el = document.createElement('textarea');
      el.value = document.getElementById('finalText').value;
      el.setAttribute('readonly', ''); el.style.position = 'absolute'; el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select(); document.execCommand('copy'); document.body.removeChild(el);
      showToast("💖 ก๊อปปี้เรียบร้อย! พร้อมส่งแชทแตกค่ะแม่!", true);
    }
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
