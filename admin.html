<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 CEO Dashboard - Magic Text 88</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; color: #333; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-radius: 1.5rem; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
  </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">

  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none z-50 transition-opacity duration-300 font-bold whitespace-nowrap">
    แจ้งเตือน
  </div>

  <div id="loginSection" class="w-full max-w-sm glass p-8 flex flex-col items-center">
    <h1 class="text-3xl font-bold text-blue-700 mb-2">👑 CEO Login</h1>
    <p class="text-sm text-gray-500 mb-6 font-semibold">ระบบจัดการลูกทีม Magic Text 88</p>
    
    <input type="password" id="adminPass" class="w-full p-3 mb-4 rounded-xl border-2 border-blue-200 focus:border-blue-500 text-center font-bold" placeholder="กรอกรหัสผ่านของบอส">
    <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl py-3 rounded-xl shadow-lg transition-colors">
      เข้าสู่ระบบจัดการ
    </button>
  </div>

  <div id="dashboardSection" class="w-full max-w-2xl glass p-8 hidden flex-col">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-blue-700">👑 CEO Dashboard</h1>
        <p class="text-sm text-gray-500 font-semibold">จัดการ Username / Password ลูกทีม</p>
      </div>
      <button onclick="logoutAdmin()" class="bg-red-100 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-200">ออกจากระบบ</button>
    </div>

    <div class="bg-blue-50 p-4 rounded-xl mb-6 border border-blue-200">
      <h2 class="font-bold text-blue-700 mb-3">➕ เพิ่มลูกทีมใหม่</h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <!-- ช่องใส่ Username (พิมพ์ตัวอักษรหรือตัวเลขก็ได้) -->
        <input type="text" id="newUsername" class="flex-1 p-2 rounded-lg border border-blue-300 focus:outline-none focus:border-blue-500 font-bold" placeholder="Username (เช่น Ploy01)" autocomplete="off">
        
        <!-- ช่องใส่ Password (รองรับทั้งตัวอักษรภาษาอังกฤษ ตัวเลข และสัญลักษณ์พิเศษ) -->
        <input type="text" id="newPassword" class="flex-1 p-2 rounded-lg border border-blue-300 focus:outline-none focus:border-blue-500 font-bold" placeholder="Password (เช่น Ploy@1234)" autocomplete="off">
        
        <button onclick="addUser()" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-lg shadow-md">เพิ่มเลย!</button>
      </div>
    </div>

    <h2 class="font-bold text-gray-700 mb-3">👥 รายชื่อลูกทีมปัจจุบัน</h2>
    <div class="overflow-x-auto bg-white rounded-xl border border-gray-200 shadow-inner">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-100 text-gray-600 text-sm">
            <th class="p-3 border-b">Username (ชื่อผู้ใช้)</th>
            <th class="p-3 border-b">Password (รหัสผ่าน)</th>
            <th class="p-3 border-b text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="3" class="text-center p-4 text-gray-500">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlXdq92GRh2FQr5IOOmX5AotKTK-on_NRzYu97ieq7cxlL95H24Q91f7sjKg3vVIMRkA/exec"; 
    let currentAdminPass = "";

    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.className = isSuccess 
        ? 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl z-[200] transition-opacity duration-300 opacity-100 font-bold whitespace-nowrap'
        : 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-full shadow-2xl z-[200] transition-opacity duration-300 opacity-100 font-bold whitespace-nowrap';
      setTimeout(() => { toast.classList.replace('opacity-100', 'opacity-0'); }, 2000);
    }

    async function loginAdmin() {
      const pass = document.getElementById('adminPass').value.trim();
      if(!pass) return showToast("ใส่รหัสบอสก่อนค่ะ!", false);
      
      currentAdminPass = pass;
      await fetchUsers();
    }

    function logoutAdmin() {
      currentAdminPass = "";
      document.getElementById('adminPass').value = "";
      document.getElementById('loginSection').style.display = "flex";
      document.getElementById('dashboardSection').style.display = "none";
      document.getElementById('userTableBody').innerHTML = "";
    }

    async function fetchUsers() {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ action: 'getUsers', adminPass: currentAdminPass })
        });
        const result = await response.json();
        
        if(result.success) {
          document.getElementById('loginSection').style.display = "none";
          document.getElementById('dashboardSection').style.display = "flex";
          renderTable(result.users);
          showToast("เข้าสู่ระบบ CEO สำเร็จ!", true);
        } else {
          showToast(result.message, false);
          currentAdminPass = ""; 
        }
      } catch (err) {
        showToast("เชื่อมต่อระบบหลังบ้านไม่ได้", false);
      }
    }

    function renderTable(users) {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = "";
      if(users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">ยังไม่มีลูกทีมในระบบ</td></tr>';
        return;
      }
      users.forEach(user => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50 transition-colors">
            <td class="p-3 font-bold text-blue-600">${user.user}</td>
            <td class="p-3 font-mono bg-gray-100 rounded">${user.pass}</td>
            <td class="p-3 text-center">
              <button onclick="deleteUser('${user.user}')" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1 px-3 rounded shadow-sm">ลบ</button>
            </td>
          </tr>
        `;
      });
    }

    async function addUser() {
      const user = document.getElementById('newUsername').value.trim();
      const pass = document.getElementById('newPassword').value.trim();
      if(!user || !pass) return showToast("กรอกชื่อและรหัสให้ครบนะคะ!", false);

      showToast("กำลังเพิ่มลูกทีม...", true);
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ action: 'addUser', adminPass: currentAdminPass, newUser: user, newPass: pass })
        });
        const result = await response.json();
        if(result.success) {
          showToast("เพิ่มลูกทีมสำเร็จ!", true);
          document.getElementById('newUsername').value = "";
          document.getElementById('newPassword').value = "";
          fetchUsers();
        } else {
          showToast(result.message, false);
        }
      } catch (err) {
        showToast("เกิดข้อผิดพลาด", false);
      }
    }

    async function deleteUser(username) {
      if(!confirm(`แม่แน่ใจนะคะว่าจะลบลูกทีมชื่อ "${username}" ออกจากระบบ?`)) return;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ action: 'deleteUser', adminPass: currentAdminPass, targetUser: username })
        });
        const result = await response.json();
        if(result.success) {
          showToast(`ลบ ${username} เรียบร้อย!`, true);
          fetchUsers();
        } else {
          showToast(result.message, false);
        }
      } catch (err) {
        showToast("เกิดข้อผิดพลาด", false);
      }
    }
  </script>
</body>
</html>
